services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quynh_nhu
      POSTGRES_PASSWORD: demo-local-only
      POSTGRES_DB: quynh_nhu_python
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - quynh_nhu_python_data:/var/lib/postgresql/data
volumes:
  quynh_nhu_python_data:
